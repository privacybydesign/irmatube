# Delivery: builds, scans and pushes ghcr.io/privacybydesign/irmatube.
# Push to master -> :edge, release -> :x.y.z and :latest. PR builds are scanned
# in Status checks; published images are re-scanned weekly by image-rescan.yml.
name: Delivery

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      # The old Delivery tagged :latest on every stable release; keep doing so.
      tag-latest: true
